[package]
name = "ifreesftp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "iFreeSftp desktop SFTP client (Rust + egui)"

[dependencies]
eframe.workspace = true
egui.workspace = true
# 仅 PNG 解码用（图标管线 D-014）；离线缓存已有 0.25.10
image = { version = "0.25", default-features = false, features = ["png"] }
# SSH/SFTP（D-011）：ring 后端（默认 aws-lc-rs 在 windows-gnu 不可用）；
# rsa feature 保住 RSA 主机密钥/算法协商；压缩 flate2 暂不启用。
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0"
# 仅自建工作线程 runtime + 超时用（连接/认证包一层 timeout）
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# 本地文件校验码（T5 校验码弹窗；russh ring 后端已在依赖树中，直接引用 digest）
ring = "0.17"
# 右键菜单粘贴：读剪贴板（egui 核心只有写 API；egui-winit 已拉入同版本）
arboard = "3"
# 注册码 Base64Url 解码（与 ifree-core include 模式共用同版本，keygen 同）
base64 = "0.22"
# 注册/更新远程通道（C# HttpClient 对应物；TLS = rustls ring 后端，
# windows-gnu 兼容，p0a 已实测 reg.ifrees.top）
# 3.5.2：基于 http crate 重写；default = rustls + gzip，后端仍是 ring（非
# aws-lc-rs，后者在 windows-gnu 不可用）；webpki-roots 1.0 直接落在修复线。
ureq = "3.5.2"
# /v1/state 响应容错解析（C# JsonDocument 对应物）
serde_json = "1"
# T15 tar 加速嵌入化：打包/解包从本机 tar 子进程改为纯 Rust 内嵌实现
# （tar::Builder/Archive + flate2 gzip，级别固定 6）。flate2 用默认 feature =
# 纯 Rust miniz_oxide 后端，禁止启用任何 C 后端 feature——保持零 C 依赖与
# zig 交叉兼容（D-018/D-021）。tar 的传递依赖 filetime 0.2.29（mtime 保留）
# 与 xattr 1.7.0（unix 默认 feature）随 lock 解析，均在本机 registry cache。
tar = "0.4.46"
flate2 = "1.1.10"
# P0-#3 保留修改时间：下载结算点设本地文件 mtime（C# SetLastWriteTime 对应物）。
# T15 起已在依赖树（tar 传递依赖 0.2.29），transfer.rs 直接消费转显式声明。
filetime = "0.2.29"
# T20-G③ 批量并发 STAT 预检（join_all）：版本与依赖树既有 0.3.34 一致，仅
# 显式声明（零新增编译负担，与 filetime 先例同做法）。
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# 正式发布构建门控：--features official 经 #[path] 并入闭源 ifree-core 真验签；
# 源码编译版（无 ifree-core 目录）不带本 feature 编译，零引用、完整可编译。
[features]
official = []

# 非 Windows 本地删除进回收站（local.rs delete_to_bin）：Linux 走 FreeDesktop
# Trash 规范、macOS 走 NSWorkspace；target-gated，Windows 构建零依赖零编译负担。
# （Windows 分支用手写 SHFileOperationW FFI，语义一致且无额外绑定）
[target.'cfg(not(windows))'.dependencies]
trash = "5"

[build-dependencies]
# 构建期密度桶：256px 源 Lanczos3 下采样到 16/20/24/32/48（与主依赖同版本同 feature）
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace]
resolver = "3"
# 注意：keygen 工具在仓库根 tools/keygen，是完全独立 crate（cargo 要求成员必须在
# workspace 目录树内，无法跨根挂载）；自持 Cargo.lock 与 target，两子项目共用其 exe

[workspace.package]
# 版本基线（2026-10-31 定案）：构建版本号全部从 0.9.0 起步。
version = "0.9.1"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
# UI 栈：egui 0.37 / wgpu 30 兼容线，2026-10-28 复核
eframe = "0.37.0"
egui = "0.37.0"
egui-winit = "0.37.0"
egui-wgpu = "0.37.0"
egui_extras = "0.37.0"
wgpu = "30.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
debug = false
